<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Offline — SkillBridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1020">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #0B1020;
      --card: #121826;
      --border: rgba(255, 255, 255, 0.1);
      --text: #F8FAFC;
      --muted: #94A3B8;
      --primary: #6366F1;
      --primary-hover: #4F46E5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .offline-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.25rem;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text);
    }
    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818CF8;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--primary);
      color: #ffffff;
      padding: 0.85rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    .cached-notice {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon" aria-hidden="true">📡</div>
    <div><span class="badge">Offline Resiliency Mode</span></div>
    <h1>No Internet Connection</h1>
    <p>
      SkillBridge is currently in offline mode. Your cached roadmaps, saved jobs, and profile remain accessible as soon as connection is re-established.
    </p>
    <button class="btn" onclick="window.location.reload()">
      <span>🔄</span> Check Connection & Retry
    </button>
    <div class="cached-notice">
      SkillBridge Progressive Web Application v2.1
    </div>
  </div>
</body>
</html>
