<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="42" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <!-- Bridge Arch Symbol -->
  <path d="M 46 130 C 46 80, 146 80, 146 130" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  <!-- AI / ML Orbit Nodes -->
  <circle cx="46" cy="130" r="10" fill="#10B981" />
  <circle cx="96" cy="92" r="12" fill="#6366F1" />
  <circle cx="146" cy="130" r="10" fill="#8B5CF6" />
  <path d="M 96 92 L 96 134" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-dasharray="4,4" />
</svg>
